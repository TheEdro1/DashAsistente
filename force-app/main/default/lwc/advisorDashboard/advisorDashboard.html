<template>
    <div class="dashboard-shell">
        <template if:true={isLoading}><lightning-spinner alternative-text="Cargando panel" size="medium"></lightning-spinner></template>
        <template if:true={hasError}><div class="error-banner" role="alert"><lightning-icon icon-name="utility:error" size="x-small"></lightning-icon> No se pudieron cargar todos los datos del panel.</div></template>

        <button class="mobile-menu-button" type="button" title="Abrir navegación" aria-label="Abrir navegación" onclick={handleMenuToggle}><lightning-icon icon-name="utility:rows" size="small"></lightning-icon></button>
        <div class={mobileNavOverlayClass} onclick={handleMenuOverlayClick}></div>
        <aside class={sidebarClass}>
            <div class="brand-lockup">
                <img src={logoUrl} alt="Dashbot" class="brand-logo" />
                <div><strong>Dashbot</strong><span>Panel de asesores</span></div>
            </div>
            <div class="workspace-chip"><span class="live-dot"></span><span>Agentforce conectado</span></div>
            <nav aria-label="Navegación principal" class="navigation">
                <span class="nav-caption">TRABAJO</span>
                <button class={navClasses.home} data-section="home" onclick={handleNavClick} type="button"><lightning-icon icon-name="utility:home" size="x-small"></lightning-icon><span>Inicio</span></button>
                <button class={navClasses.prospectos} data-section="prospectos" onclick={handleNavClick} type="button"><lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon><span>Prospectos</span><b>{onlineProspects}</b></button>
                <button class={navClasses.conversaciones} data-section="conversaciones" onclick={handleNavClick} type="button"><lightning-icon icon-name="utility:chat" size="x-small"></lightning-icon><span>Conversaciones</span><b>{activeConversations}</b></button>
                <button class={navClasses.citas} data-section="citas" onclick={handleNavClick} type="button"><lightning-icon icon-name="utility:event" size="x-small"></lightning-icon><span>Agenda</span></button>
                <button class={navClasses.alertas} data-section="alertas" onclick={handleNavClick} type="button"><lightning-icon icon-name="utility:notification" size="x-small"></lightning-icon><span>Por atender</span><b class="danger">{attentionCount}</b></button>
            </nav>
            <div class="sidebar-footer"><span class="advisor-avatar">HA</span><div><strong>Asesor activo</strong><span>Sesión de trabajo</span></div></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div><p class="eyebrow">CENTRO DE CAPTURA</p><h1>Panel de captura</h1><p class="topbar-subtitle">Entiende, responde y da seguimiento a tus prospectos desde un solo lugar.</p></div>
                <div class="topbar-tools"><label class="search-box"><lightning-icon icon-name="utility:search" size="xx-small"></lightning-icon><input type="search" placeholder="Buscar prospectos o conversaciones" oninput={handleSearch} /></label><button class="icon-button" type="button" title="Notificaciones"><lightning-icon icon-name="utility:notification" size="small"></lightning-icon><span>{attentionCount}</span></button></div>
            </header>

            <section class="metric-row">
                <article class="metric-card metric-blue"><span class="metric-icon"><lightning-icon icon-name="utility:groups" size="small"></lightning-icon></span><div><span>Prospectos activos</span><strong>{onlineProspects}</strong><small>En seguimiento</small></div></article>
                <article class="metric-card metric-green"><span class="metric-icon"><lightning-icon icon-name="utility:chat" size="small"></lightning-icon></span><div><span>Conversaciones</span><strong>{activeConversations}</strong><small>Registros disponibles</small></div></article>
                <article class="metric-card metric-orange"><span class="metric-icon"><lightning-icon icon-name="utility:notification" size="small"></lightning-icon></span><div><span>Por atender</span><strong>{attentionCount}</strong><small>Requieren tu criterio</small></div></article>
                <article class="metric-card metric-purple"><span class="metric-icon"><lightning-icon icon-name="utility:event" size="small"></lightning-icon></span><div><span>Citas hoy</span><strong>{todayAppointments}</strong><small>Agenda sincronizada</small></div></article>
            </section>

            <template if:true={isHomeSection}>
                <section class="assistant-home">
                    <div class="assistant-intro"><div><span class="section-kicker">ASISTENTE DE CAPTURA</span><h2>¿Qué quieres preparar hoy?</h2><p>Describe una conversación o una nueva oportunidad. Dashbot te ayuda a ordenar la información antes de pasarla a Salesforce.</p></div><span class="assistant-orb"><img src={logoUrl} alt="Dashbot" /></span></div>
                    <div class="assistant-thread"><template for:each={assistantMessages} for:item="message"><article class={message.bubbleClass} key={message.id}><span class="message-author">{message.author} <small>{message.time}</small></span><p>{message.body}</p></article></template></div>
                    <div class="suggestion-row"><button type="button" data-prompt="Quiero capturar un nuevo prospecto" onclick={handleAssistantSuggestion}>Capturar prospecto</button><button type="button" data-prompt="Resume las conversaciones que requieren atención" onclick={handleAssistantSuggestion}>Revisar pendientes</button><button type="button" data-prompt="¿Qué citas tengo en mi agenda?" onclick={handleAssistantSuggestion}>Ver mi agenda</button></div>
                    <div class="assistant-composer"><lightning-textarea class="assistant-input" label="Mensaje para el asistente" variant="label-hidden" value={assistantDraft} onchange={handleAssistantInput} onkeydown={handleAssistantKeydown} placeholder="Escribe aquí cómo quieres empezar..."></lightning-textarea><button class="send-button" type="button" onclick={submitAssistantPrompt} title="Enviar"><lightning-icon icon-name="utility:arrowup" size="x-small"></lightning-icon></button><span>Enter para enviar · Shift + Enter para nueva línea</span></div>
                </section>
            </template>

            <template if:true={isProspectosSection}>
                <section class="work-grid">
                    <article class="surface prospect-surface">
                        <div class="section-heading"><div><span class="section-kicker">BANDEJA DE CAPTURA</span><h2>Prospectos recientes</h2><p>Selecciona una fila para revisar su ficha y contexto.</p></div><span class="count-badge">{filteredProspects.length}</span></div>
                        <div class="prospect-list"><template for:each={filteredProspects} for:item="prospect"><button key={prospect.id} class={prospect.rowClass} data-id={prospect.id} onclick={handleSelectProspect} type="button"><span class={prospect.avatarClass}>{prospect.initials}</span><span class="prospect-main"><strong>{prospect.name}</strong><small>{prospect.interest}</small></span><span class="prospect-channel"><lightning-icon icon-name={prospect.channelIcon} size="xx-small"></lightning-icon>{prospect.channel}</span><span class={prospect.statusClass}>{prospect.statusLabel}</span><span class="prospect-time">{prospect.lastActivity}</span></button></template></div>
                        <div class="surface-footer">Mostrando {filteredProspects.length} prospectos <span>Datos de Salesforce</span></div>
                    </article>
                     <aside class="side-stack"><article class="surface context-card"><div class="section-heading compact"><div><span class="section-kicker">FICHA DEL PROSPECTO</span><h2>{selectedProspect.name}</h2></div><span class={selectedProspect.statusClass}>{selectedProspect.statusLabel}</span></div><div class="profile-summary"><span class={selectedProspect.avatarLargeClass}>{selectedProspect.initials}</span><div><strong>{selectedProspect.interest}</strong><span>{selectedProspect.channel} · {selectedProspect.stage}</span></div></div><dl class="detail-grid"><div><dt>Actividad</dt><dd>{selectedProspect.activity}</dd></div><div><dt>Próxima cita</dt><dd>{selectedProspect.nextAppointment}</dd></div><div><dt>Último contacto</dt><dd>{selectedProspect.lastActivity}</dd></div><div><dt>Etapa</dt><dd>{selectedProspect.stage}</dd></div></dl><template if:true={selectedProspect.needsAttention}><div class="attention-note"><strong>Solicitó atención</strong><span>{selectedProspect.alertReason}</span></div></template><button class="primary-button full-button" data-id={selectedProspect.id} onclick={handleOpenProspectConversation} type="button">Abrir conversación <span>→</span></button></article><article class="surface mini-calendar-card"><div class="section-heading compact"><div><span class="section-kicker">AGENDA</span><h2>{calendarShortLabel}</h2></div><button class="text-button" data-section="citas" onclick={handleNavClick} type="button">Ver calendario</button></div><p class="agenda-summary">{rawAppointments.length} citas sincronizadas para este día.</p><template for:each={appointments} for:item="appointment"><div class="mini-event" key={appointment.id}><span>{appointment.time}</span><strong>{appointment.name}</strong></div></template></article></aside>
                </section>
            </template>

            <template if:true={isConversacionesSection}>
                <section class="conversation-layout">
                    <article class="surface inbox-panel"><div class="section-heading"><div><span class="section-kicker">MENSAJERÍA</span><h2>Conversaciones</h2><p>Un inbox conversacional para no perder el contexto.</p></div><span class="count-badge">{filteredConversations.length}</span></div><div class="inbox-list"><template for:each={filteredConversations} for:item="conversation"><button key={conversation.Id} class={conversation.rowClass} data-id={conversation.Id} onclick={handleSelectConversation} type="button"><span class="avatar">{conversation.initials}</span><span><strong>{conversation.leadName}</strong><small>{conversation.channelLabel} · {conversation.preview}</small></span><em>{conversation.conversationTime}</em><b class={conversation.statusClass}>{conversation.conversationStatus}</b></button></template></div></article>
                    <article class="surface chat-panel">
                        <template if:true={hasSelectedConversation}>
                            <header class="chat-header">
                                <div class="profile-summary">
                                    <span class="avatar avatar-large">{selectedChatProspect.initials}</span>
                                    <div>
                                        <strong>{selectedChatProspect.name}</strong>
                                        <span>{selectedConversation.Channel__c} · {selectedConversation.Status__c}</span>
                                    </div>
                                </div>
                                <div class="agent-presence">
                                    <span class="agent-avatar" aria-hidden="true"><svg viewBox="0 0 40 40" width="32" height="32"><defs><linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0759c9"/><stop offset="60%" stop-color="#087fd1"/><stop offset="100%" stop-color="#12a9ed"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="url(#agentGrad)"/><path d="M14 22c0-3 2.5-5 6-5s6 2 6 5v2h-12v-2z" fill="#fff"/><circle cx="20" cy="14" r="4" fill="#fff"/><circle cx="29" cy="14" r="2.4" fill="#fff" opacity=".85"/><circle cx="32" cy="20" r="2" fill="#fff" opacity=".55"/></svg></span>
                                    <div><strong>Asistente Financiero</strong><span>Agentforce responde por WhatsApp</span></div>
                                </div>
                                <button class="primary-button" onclick={handleTakeConversation} type="button">Tomar conversación</button>
                            </header>
                            <template if:true={selectedChatProspect.needsAttention}>
                                <div class="chat-alert">
                                    <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                    <span>{selectedChatProspect.alertReason}</span>
                                </div>
                            </template>
                            <div class="chat-thread">
                                <template if:true={isLoadingMessages}>
                                    <lightning-spinner alternative-text="Cargando mensajes" size="small"></lightning-spinner>
                                </template>
                                <template if:true={hasMessages}>
                                    <template for:each={chatMessages} for:item="message">
                                        <div key={message.id} class={message.bubbleClass}>
                                            <span>{message.sender}</span>
                                            <p>{message.body}</p>
                                            <small>{message.time}</small>
                                            <template if:true={message.providerError}>
                                                <div class="message-provider-error">{message.providerError}</div>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasMessages}>
                                    <div class="empty-chat">
                                        <span class="empty-chat-icon">◌</span>
                                        <strong>La conversación está lista</strong>
                                        <p>Aún no hay mensajes guardados para este prospecto.</p>
                                    </div>
                                </template>
                            </div>
                            <footer class="chat-footer">
                                <div class="chat-ai-toolbar">
                                    <button
                                        class="secondary-button"
                                        type="button"
                                        disabled={isSuggestionDisabled}
                                        onclick={handleGenerateSuggestion}>
                                        <template if:false={isGeneratingSuggestion}>✦ Sugerir respuesta con IA</template>
                                        <template if:true={isGeneratingSuggestion}>Generando sugerencia...</template>
                                    </button>
                                    <span>Agentforce redacta; tú revisas antes de enviar.</span>
                                </div>
                                <div class="chat-composer">
                                    <lightning-textarea
                                        class="chat-composer-input"
                                        label="Escribir respuesta"
                                        variant="label-hidden"
                                        placeholder="Escribe una respuesta..."
                                        value={messageDraft}
                                        disabled={isSendingMessage}
                                        onchange={handleMessageInput}
                                        onkeydown={handleMessageKeydown}>
                                    </lightning-textarea>
                                    <button
                                        class="primary-button chat-send-button"
                                        type="button"
                                        disabled={isSendDisabled}
                                        onclick={handleSendMessage}>
                                        <template if:false={isSendingMessage}>Enviar</template>
                                        <template if:true={isSendingMessage}>Enviando...</template>
                                    </button>
                                </div>
                                <template if:true={messagesError}>
                                    <div class="message-send-error" role="alert">{messagesErrorText}</div>
                                </template>
                                <div class="chat-sync-status">
                                    <span><span class="live-dot"></span> Sincronizado cada 5 segundos</span>
                                    <span>{selectedConversation.Channel__c} · {selectedIntegrationLabel}</span>
                                </div>
                            </footer>
                        </template>
                        <template if:false={hasSelectedConversation}>
                            <div class="empty-chat large">
                                <span class="empty-chat-icon">✦</span>
                                <strong>Elige una conversación</strong>
                                <p>Selecciona un prospecto de la bandeja para ver sus mensajes.</p>
                            </div>
                        </template>
                    </article>
                    <aside class="surface chat-context"><span class="section-kicker">FICHA DEL PROSPECTO</span><h2>{selectedChatProspect.name}</h2><div class="detail-grid"><div><dt>Producto</dt><dd>{selectedChatProspect.interest}</dd></div><div><dt>Etapa</dt><dd>{selectedChatProspect.stage}</dd></div><div><dt>Actividad</dt><dd>{selectedChatProspect.activity}</dd></div><div><dt>Próxima cita</dt><dd>{selectedChatProspect.nextAppointment}</dd></div></div><button class="secondary-button full-button" data-section="prospectos" onclick={handleNavClick} type="button">Volver a prospectos</button></aside>
                </section>
            </template>

            <template if:true={isCitasSection}>
                 <section class="surface calendar-surface"><div class="calendar-toolbar"><div><span class="section-kicker">AGENDA COMPARTIDA</span><h2>{calendarLabel}</h2><p>Citas de todos los asesores sincronizadas en Salesforce.</p></div><div class="calendar-controls"><button class="icon-button plain" data-shift="-1" onclick={shiftCalendar} title="Día anterior" type="button">←</button><button class="secondary-button" onclick={goToToday} type="button">Hoy</button><button class="icon-button plain" data-shift="1" onclick={shiftCalendar} title="Día siguiente" type="button">→</button><input class="date-input" type="date" value={selectedCalendarDate} onchange={handleDateChange} /></div></div><div class="timeline"><template if:true={hasAppointments}><template for:each={appointments} for:item="appointment"><article class="timeline-event" key={appointment.id}><div class="timeline-time"><strong>{appointment.time}</strong><span>{appointment.endTime}</span></div><span class="timeline-dot"></span><div class="event-card"><div class="event-card-top"><span class="channel-label"><span class="live-dot"></span>{appointment.channel}</span><span class="event-id">Event sincronizado</span></div><h3>{appointment.subject}</h3><p>{appointment.name}</p><template if:true={appointment.hasProspect}><button class="text-button" data-id={appointment.whoId} onclick={handleSelectProspect} type="button">Abrir prospecto →</button></template></div></article></template></template><template if:false={hasAppointments}><div class="empty-state"><span>◷</span><strong>No hay citas para este día</strong><p>Prueba con otro día para revisar tu agenda.</p></div></template></div></section>
            </template>

            <template if:true={isAlertasSection}><section class="surface alert-view"><div class="section-heading"><div><span class="section-kicker">ATENCIÓN HUMANA</span><h2>Prioriza lo que necesita tu criterio</h2><p>Estas conversaciones ya fueron detectadas por Agentforce.</p></div><span class="count-badge danger-badge">{attentionCount}</span></div><div class="alert-grid"><template for:each={filteredProspects} for:item="prospect"><template if:true={prospect.needsAttention}><button class="alert-card" key={prospect.id} data-id={prospect.id} onclick={handleSelectProspect} type="button"><span class="avatar attention">{prospect.initials}</span><span><strong>{prospect.name}</strong><small>{prospect.alertReason}</small><em>{prospect.lastActivity}</em></span><span>Atender →</span></button></template></template></div></section></template>
        </main>
    </div>
</template>
